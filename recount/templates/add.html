{% extends "base.html" %}
{% block title %}Добавить товар{% endblock %}
{% block content %}
<div class="card" style="max-width: 500px;">
    <h1>Добавить товар</h1>
    <form method="post">
        <p>
            <label>Название:</label><br>
            <input type="text" name="name" required>
        </p>
        <p>
            <label>Категория:</label><br>
            <input type="text" name="category" required>
        </p>
        <p>
            <label>Цена (₽):</label><br>
            <input type="number" name="price" step="0.01" min="0" required>
        </p>
        <p>
            <label>Количество на складе:</label><br>
            <input type="number" name="stock" value="10" min="0" required>
        </p>
        <button type="submit" class="btn-blue">Добавить</button>
    </form>
    <p><a href="{{ url_for('index') }}">← Назад в магазин</a></p>
</div>
{% endblock %}
